name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: txill
          POSTGRES_PASSWORD: txill_dev
          POSTGRES_DB: txillapp
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U txill" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
