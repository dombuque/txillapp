# Subdomínios do Txillapp (atrás do Cloudflare, modo SSL "Full (strict)" com certificado Let's Encrypt renovado sozinho).
#   txillapp.com          a aplicação (apresentação para quem não entrou; www redireciona para aqui)
#   app.txillapp.com      a aplicação (e /api no mesmo endereço: sem CORS, mais rápido)
#   api.txillapp.com      a mesma API, para apps nativas e integrações
#   admin.txillapp.com    moderação e estatísticas (proteger com Cloudflare Access)
#   monitor.txillapp.com  Grafana/Prometheus (proteger com Cloudflare Access)
#   media.txillapp.com    NÃO passa por aqui: é o domínio personalizado do bucket público do R2

upstream txill_api { server api:3000; keepalive 32; }

# app.txillapp.com é a casa do telemóvel. Quem abre noutro aparelho (computador) vai para a versão web em txillapp.com.
# Telemóveis e tablets Android/iPhone ficam; a API e o tempo real nunca são redirecionados (pedidos /api/).
map $http_user_agent $is_mobile {
  default 0;
  "~*(android|iphone|ipod|ipad|mobile|windows phone|opera mini|blackberry)" 1;
}
map "$host:$is_mobile:$request_uri" $desktop_to_web {
  default 0;
  "~^app\.txillapp\.com:0:(?!/api/)" 1;
}

# Estado interno (healthcheck do contentor), só dentro do contentor.
server {
  listen 8081;
  access_log off;
  location = /healthz { return 200 "ok\n"; }
}

# Qualquer outro nome (acesso direto por IP, domínios errados): fechar a ligação.
server {
  listen 80 default_server;
  listen 443 ssl default_server;
  ssl_certificate     /etc/letsencrypt/live/txillapp.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/txillapp.com/privkey.pem;
  return 444;
}

server {
  listen 80;
  server_name txillapp.com www.txillapp.com app.txillapp.com api.txillapp.com admin.txillapp.com monitor.txillapp.com;
  return 301 https://$host$request_uri;
}

# www → endereço sem www
server {
  listen 443 ssl;
  http2 on;
  server_name www.txillapp.com;
  ssl_certificate     /etc/letsencrypt/live/txillapp.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/txillapp.com/privkey.pem;
  return 301 https://txillapp.com$request_uri;
}

# ───────────── app (txillapp.com e app.txillapp.com: a mesma aplicação) ─────────────
server {
  listen 443 ssl;
  http2 on;
  server_name txillapp.com app.txillapp.com;
  ssl_certificate     /etc/letsencrypt/live/txillapp.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/txillapp.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(self), payment=()" always;
  add_header X-Frame-Options "DENY" always;
  # Primeiro em modo de observação; depois de ver que nada legítimo é bloqueado, passa a Content-Security-Policy.
  add_header Content-Security-Policy-Report-Only "default-src 'self'; img-src 'self' data: blob: https://media.txillapp.com https://tile.openstreetmap.org https://*.tile.openstreetmap.org; media-src 'self' blob: https://media.txillapp.com; connect-src 'self' https://*.r2.cloudflarestorage.com https://media.txillapp.com; script-src 'self' https://accounts.google.com; frame-src https://accounts.google.com; style-src 'self' 'unsafe-inline' https://accounts.google.com; worker-src 'self'; manifest-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

  root /usr/share/nginx/html;
  index index.html;

  # Computador em app.txillapp.com → versão web (a resposta depende do aparelho, por isso não pode ficar em cache partilhada).
  if ($desktop_to_web) { return 302 https://txillapp.com$request_uri; }
  add_header Vary User-Agent always;

  # Navegadores pedem /favicon.ico por conta própria: responder com o ficheiro do logótipo, não com a página da app.
  location = /favicon.ico { try_files /favicon.ico =404; expires 1d; }

  # A moderação só existe no subdomínio admin (e a API de moderação também).
  location ~ ^/(admin|api/v1/admin|api/v1/metrics) { return 404; }

  # Tempo real (SSE): sem buffer, sem compressão, ligação longa.
  location = /api/v1/chat/stream {
    proxy_pass http://txill_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    # País do pedido, dado pelo Cloudflare. Se não vier, o valor que o cliente tenha mandado é apagado (não dá para forjar).
    proxy_set_header X-Client-Country $http_cf_ipcountry;
    proxy_buffering off;
    proxy_cache off;
    gzip off;
    proxy_read_timeout 3600s;
  }

  # Entrar/registar/refrescar: mais apertado.
  location ~ ^/api/v1/auth/(login|register|google|refresh|password) {
    limit_req zone=auth burst=8 nodelay;
    proxy_pass http://txill_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    # País do pedido, dado pelo Cloudflare. Se não vier, o valor que o cliente tenha mandado é apagado (não dá para forjar).
    proxy_set_header X-Client-Country $http_cf_ipcountry;
  }

  location /api/ {
    limit_req zone=api burst=80 nodelay;
    proxy_pass http://txill_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    # País do pedido, dado pelo Cloudflare. Se não vier, o valor que o cliente tenha mandado é apagado (não dá para forjar).
    proxy_set_header X-Client-Country $http_cf_ipcountry;
    proxy_read_timeout 120s;
    proxy_request_buffering off; # envios grandes seguem para a API sem encher o disco do nginx
  }

  # O que não muda de nome (ficheiros com hash) guarda-se um ano; o que decide a versão da app nunca.
  location /assets/ { expires 1y; access_log off; }
  location ~* ^/(sw\.js|registerSW\.js|manifest\.webmanifest|push-sw\.js|workbox-.*\.js)$ {
    # txillapp.com não é instalável (a app instala-se em app.txillapp.com): sem manifesto, o telemóvel nem o oferece.
    set $no_manifest "$host$uri";
    if ($no_manifest = "txillapp.com/manifest.webmanifest") { return 404; }
    expires -1;
    try_files $uri =404;
  }
  location / {
    expires -1;
    try_files $uri /index.html;
  }
}

# ───────────── api (a mesma API noutro endereço) ─────────────
server {
  listen 443 ssl;
  http2 on;
  server_name api.txillapp.com;
  ssl_certificate     /etc/letsencrypt/live/txillapp.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/txillapp.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;

  location ~ ^/api/v1/(admin|metrics) { return 404; }
  location = /api/v1/chat/stream {
    proxy_pass http://txill_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    # País do pedido, dado pelo Cloudflare. Se não vier, o valor que o cliente tenha mandado é apagado (não dá para forjar).
    proxy_set_header X-Client-Country $http_cf_ipcountry;
    proxy_buffering off;
    gzip off;
    proxy_read_timeout 3600s;
  }
  location /api/ {
    limit_req zone=api burst=80 nodelay;
    proxy_pass http://txill_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    # País do pedido, dado pelo Cloudflare. Se não vier, o valor que o cliente tenha mandado é apagado (não dá para forjar).
    proxy_set_header X-Client-Country $http_cf_ipcountry;
  }
  location / { return 404; }
}

# ───────────── admin (mesma app + API, protegida por Cloudflare Access) ─────────────
server {
  listen 443 ssl;
  http2 on;
  server_name admin.txillapp.com;
  ssl_certificate     /etc/letsencrypt/live/txillapp.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/txillapp.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header X-Robots-Tag "noindex, nofollow" always;

  root /usr/share/nginx/html;
  index index.html;

  location = /api/v1/chat/stream {
    proxy_pass http://txill_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    # País do pedido, dado pelo Cloudflare. Se não vier, o valor que o cliente tenha mandado é apagado (não dá para forjar).
    proxy_set_header X-Client-Country $http_cf_ipcountry;
    proxy_buffering off;
    gzip off;
    proxy_read_timeout 3600s;
  }
  location /api/ {
    limit_req zone=api burst=40 nodelay;
    proxy_pass http://txill_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    # País do pedido, dado pelo Cloudflare. Se não vier, o valor que o cliente tenha mandado é apagado (não dá para forjar).
    proxy_set_header X-Client-Country $http_cf_ipcountry;
  }
  location /assets/ { expires 1y; }
  location / { expires -1; try_files $uri /index.html; }
}

# ───────────── monitor (Grafana) ─────────────
server {
  listen 443 ssl;
  http2 on;
  server_name monitor.txillapp.com;
  ssl_certificate     /etc/letsencrypt/live/txillapp.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/txillapp.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Robots-Tag "noindex, nofollow" always;

  # Resolve o Grafana só quando alguém pede: o nginx arranca mesmo sem o perfil "monitoring" ligado.
  resolver 127.0.0.11 valid=10s;
  set $grafana http://grafana:3000;
  location / {
    proxy_pass $grafana;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    # País do pedido, dado pelo Cloudflare. Se não vier, o valor que o cliente tenha mandado é apagado (não dá para forjar).
    proxy_set_header X-Client-Country $http_cf_ipcountry;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }
}
