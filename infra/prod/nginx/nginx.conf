worker_processes auto;
pid /tmp/nginx.pid;
events { worker_connections 2048; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  server_tokens off;
  sendfile      on;
  keepalive_timeout 65;

  # Atrás do Cloudflare: o IP verdadeiro vem em CF-Connecting-IP (só se confia nele se o pedido veio de um IP do Cloudflare).
  include /etc/nginx/cloudflare-ips.conf;
  real_ip_header CF-Connecting-IP;

  log_format main '$remote_addr [$time_iso8601] "$request" $status $body_bytes_sent '
                  '$request_time "$http_referer" host=$host';
  access_log /var/log/nginx/access.log main;
  error_log  /var/log/nginx/error.log warn;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 512;
  gzip_vary on;
  # text/event-stream NÃO entra: o tempo real tem de sair logo, sem ficar em memória.
  gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;

  # Travões contra abuso: login e registo mais apertados; a API em geral mais largo.
  limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
  limit_req_zone $binary_remote_addr zone=api:10m  rate=40r/s;
  limit_req_status 429;
  limit_conn_zone $binary_remote_addr zone=perip:10m;

  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  # Ficheiros até 110 MB (vídeos de 100 MB). Com o armazenamento na nuvem, os envios vão direto para o R2 e não passam aqui.
  client_max_body_size 110m;

  include /etc/nginx/conf.d/*.conf;
}
