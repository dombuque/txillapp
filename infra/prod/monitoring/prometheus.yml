global:
  scrape_interval: 15s

scrape_configs:
  - job_name: txillapp-api
    metrics_path: /api/v1/metrics
    authorization:
      credentials_file: /etc/prometheus/metrics_token # criado no deploy a partir de METRICS_TOKEN
    static_configs: [{ targets: ['api:3000'] }]
  - job_name: node
    static_configs: [{ targets: ['node-exporter:9100'] }]
  - job_name: containers
    static_configs: [{ targets: ['cadvisor:8080'] }]
  - job_name: postgres
    static_configs: [{ targets: ['postgres-exporter:9187'] }]
