# Txillapp em produção (um servidor, Docker Compose). Guia completo: docs/DEPLOY.md
#
#   cp .env.example .env   # preencher TODOS os valores
#   docker compose up -d --build
#   docker compose --profile monitoring up -d     # Prometheus + Grafana (opcional)
#   docker compose --profile search up -d         # Elasticsearch (opcional)
name: txillapp

x-logging: &logging
  driver: json-file
  options: { max-size: 10m, max-file: '5' }

services:
  # Entrada: HTTPS, app web compilada e encaminhamento de /api. É a única coisa exposta ao exterior.
  nginx:
    build: { context: ../.., dockerfile: apps/web/Dockerfile }
    image: txillapp-edge:latest
    restart: unless-stopped
    ports: ['80:80', '443:443']
    # /opt/txillapp/downloads: APKs de teste e a página de instalação (txillapp.com/app/…), postos à mão, fora do git.
    volumes: ['letsencrypt:/etc/letsencrypt:ro', '/opt/txillapp/downloads:/srv/app:ro']
    # Recarrega a cada 6 h para apanhar os certificados renovados pelo certbot (sem cortar ligações).
    command: ['/bin/sh', '-c', 'while :; do sleep 6h; nginx -s reload; done & exec nginx -g "daemon off;"']
    depends_on:
      api: { condition: service_healthy }
    networks: [edge, backend]
    # As ligações longas do tempo real (SSE): ver worker_connections no nginx.conf.
    ulimits: { nofile: { soft: 65535, hard: 65535 } }
    logging: *logging

  # Certificados Let's Encrypt (desafio DNS no Cloudflare: não precisa da porta 80 nem de o servidor estar visível).
  # Primeira emissão: ver docs/DEPLOY.md. Depois renova sozinho quando faltam menos de 30 dias.
  certbot:
    image: certbot/dns-cloudflare:v3.0.1
    restart: unless-stopped
    entrypoint: ['/bin/sh', '-c', 'trap exit TERM; while :; do certbot renew --quiet; sleep 12h & wait $${!}; done']
    volumes:
      - letsencrypt:/etc/letsencrypt
      - ./certbot/cloudflare.ini:/etc/cloudflare.ini:ro
    networks: [backend]
    logging: *logging

  # A API: API_REPLICAS processos iguais (3 por omissão, um por núcleo e meio), atrás do nginx (least_conn). Só servem
  # pedidos (ROLE=web): o tempo real (SSE), quem está ligado e os limites de pedidos passam pelo Redis, e as tarefas
  # periódicas e as filas ficam no `worker`. Guia: docs/escala.md.
  #   Mudar o número:  API_REPLICAS=4 docker compose up -d api   (ver a conta das ligações ao PostgreSQL em docs/escala.md)
  api:
    build: { context: ../.., dockerfile: apps/api/Dockerfile }
    image: txillapp-api:latest
    restart: unless-stopped
    env_file: .env
    environment: &api-env
      DATABASE_URL: postgres://txill:${POSTGRES_PASSWORD}@postgres:5432/txillapp
      NODE_ENV: production
      ADMIN_URL: https://admin.txillapp.com
      # A senha vai à parte (sem codificar caracteres no URL); vale mais do que um REDIS_URL antigo no .env.
      REDIS_URL: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      ROLE: web
      # 20 ligações por processo; uma consulta pode durar até 30 s (docs/escala.md, «Ligações ao PostgreSQL»).
      PG_POOL_MAX: ${API_PG_POOL_MAX:-20}
      PG_STATEMENT_TIMEOUT_MS: ${API_STATEMENT_TIMEOUT_MS:-30000}
    volumes: &api-volumes
      - uploads:/data/uploads # só usado com STORAGE_DRIVER=local (e como pasta temporária dos vídeos)
      - models:/data/models # modelo de verificação de fotos (descarrega uma vez)
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    networks: [backend]
    # Cada processo: o Node, os modelos da verificação de fotos (ONNX) e o sharp. Os vídeos e as montagens vão para o worker.
    deploy:
      replicas: ${API_REPLICAS:-3}
      resources: { limits: { memory: 1536m } }
    ulimits: { nofile: { soft: 65535, hard: 65535 } }
    stop_grace_period: 20s
    logging: *logging

  # O trabalho de fundo, num processo à parte (a mesma imagem, ROLE=worker): as tarefas periódicas (limpezas, lembretes,
  # sexta da gelada, nível da geleira, catálogo de música…), a fila da montagem das tchekas, a conversão dos vídeos e o
  # silenciar dos sons. Um só (as tarefas periódicas não podem correr duas vezes; as filas aguentam mais, ver docs/escala.md).
  # O nginx não lhe manda pedidos: escuta na 3000 só para o healthcheck e para o Prometheus.
  worker:
    image: txillapp-api:latest
    restart: unless-stopped
    env_file: .env
    environment:
      <<: *api-env
      ROLE: worker
      PG_POOL_MAX: ${WORKER_PG_POOL_MAX:-10}
      # A vista das análises e as limpezas grandes podem passar dos 30 s.
      PG_STATEMENT_TIMEOUT_MS: ${WORKER_STATEMENT_TIMEOUT_MS:-300000}
    volumes: *api-volumes
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    networks: [backend]
    # O Node, os modelos (vídeos verificados aqui) e os ffmpeg da montagem (até 2 × ~0,5 GB) e dos vídeos.
    deploy: { resources: { limits: { memory: 3g } } }
    # Ao parar: a montagem a meio fica «Tenta outra vez» e o vídeo a meio volta para a fila.
    stop_grace_period: 30s
    logging: *logging

  # Servidor TURN para as chamadas de voz e vídeo (opcional: docker compose --profile calls up -d coturn).
  # Só entra quando as duas pessoas não se conseguem ligar diretamente (redes móveis com NAT apertado, firewalls de empresa)
  # ou quando alguém escolhe "Esconder o meu IP nas chamadas". As credenciais são temporárias (6 h), assinadas com TURN_SECRET,
  # o mesmo segredo que a API usa. Rede do anfitrião: o TURN precisa de muitas portas UDP e do IP público verdadeiro.
  # DNS: turn.txillapp.com com o registo A em "DNS only" (nuvem cinzenta no Cloudflare), não passa pelo proxy.
  # Firewall: abrir 3478/udp, 3478/tcp e 49160-49200/udp. Guia: docs/DEPLOY.md, secção Chamadas.
  coturn:
    image: coturn/coturn:4.6.2
    profiles: [calls]
    restart: unless-stopped
    network_mode: host
    command:
      - -n
      - --listening-port=3478
      - --fingerprint
      - --use-auth-secret
      - --static-auth-secret=${TURN_SECRET:?falta TURN_SECRET no .env}
      - --realm=txillapp.com
      - --min-port=49160
      - --max-port=49200
      - --no-cli
      - --no-tls
      - --no-dtls
      - --no-multicast-peers
      - --denied-peer-ip=10.0.0.0-10.255.255.255
      - --denied-peer-ip=172.16.0.0-172.31.255.255
      - --denied-peer-ip=192.168.0.0-192.168.255.255
      - --denied-peer-ip=127.0.0.0-127.255.255.255
      - --total-quota=60
      - --user-quota=4
      - --max-bps=1500000
      - --log-file=stdout
    logging: *logging

  # Aplica as migrações SQL antes de a API arrancar (seguro repetir: só corre o que falta).
  migrate:
    image: txillapp-api:latest
    command: ['node', 'dist/db/migrate.js']
    restart: 'no'
    environment:
      DATABASE_URL: postgres://txill:${POSTGRES_PASSWORD}@postgres:5432/txillapp
    depends_on:
      postgres: { condition: service_healthy }
    networks: [backend]

  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: txill
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: txillapp
    # Afinado para ~11 GB de RAM partilhada com a API; ajusta se o servidor for diferente.
    # Ligações: 3 api × 20 + worker 10 + migrate 1 + backup 1 + exportador 2 + psql 3 + 3 reservadas ≈ 81 de 100.
    # Com API_REPLICAS=4 (ou PG_POOL_MAX maior) passa de 100: subir max_connections (docs/escala.md, «Ligações ao PostgreSQL»).
    command: >
      postgres -c shared_buffers=2GB -c effective_cache_size=5GB -c work_mem=16MB -c maintenance_work_mem=512MB
      -c max_connections=100 -c wal_compression=on -c log_min_duration_statement=500
    volumes: ['pgdata:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U txill -d txillapp']
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend] # sem portas no exterior
    shm_size: 512mb
    logging: *logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes', '--requirepass', '${REDIS_PASSWORD}', '--maxmemory', '256mb', '--maxmemory-policy', 'allkeys-lru']
    volumes: ['redisdata:/data']
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" ping | grep PONG']
      interval: 10s
      timeout: 3s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks: [backend]

  # Cópias de segurança cifradas da base de dados, todas as noites, para um armazenamento independente.
  backup:
    build: { context: ./backup }
    image: txillapp-backup:latest
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://txill:${POSTGRES_PASSWORD}@postgres:5432/txillapp
    volumes:
      - uploads:/data/uploads:ro
    depends_on:
      postgres: { condition: service_healthy }
    networks: [backend]
    logging: *logging

  # ───────────── opcionais ─────────────
  prometheus:
    profiles: ['monitoring']
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    command: ['--config.file=/etc/prometheus/prometheus.yml', '--storage.tsdb.retention.time=30d']
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/metrics_token:/etc/prometheus/metrics_token:ro
      - promdata:/prometheus
    networks: [backend]

  grafana:
    profiles: ['monitoring']
    image: grafana/grafana:11.3.0
    restart: unless-stopped
    environment:
      GF_SERVER_ROOT_URL: https://monitor.txillapp.com
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
    volumes:
      - grafanadata:/var/lib/grafana
      - ./monitoring/grafana-datasource.yml:/etc/grafana/provisioning/datasources/prometheus.yml:ro
    networks: [backend]

  node-exporter:
    profiles: ['monitoring']
    image: prom/node-exporter:v1.8.2
    restart: unless-stopped
    pid: host
    volumes: ['/:/host:ro,rslave']
    command: ['--path.rootfs=/host']
    networks: [backend]

  cadvisor:
    profiles: ['monitoring']
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    restart: unless-stopped
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks: [backend]

  postgres-exporter:
    profiles: ['monitoring']
    image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: postgresql://txill:${POSTGRES_PASSWORD}@postgres:5432/txillapp?sslmode=disable
    depends_on:
      postgres: { condition: service_healthy }
    networks: [backend]

  # O Redis do tempo real e dos limites (memória usada, chaves, ligações, mensagens do pub/sub).
  redis-exporter:
    profiles: ['monitoring']
    image: oliver006/redis_exporter:v1.62.0
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on:
      redis: { condition: service_healthy }
    networks: [backend]

  elasticsearch:
    profiles: ['search']
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: 'true'
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD}
      ES_JAVA_OPTS: -Xms1g -Xmx1g
    volumes: ['esdata:/usr/share/elasticsearch/data']
    networks: [backend]

networks:
  edge: {}
  backend: { internal: false } # a API precisa de sair para a Google, o R2 e as notificações; nada entra senão pelo nginx

volumes:
  letsencrypt:
  pgdata:
  redisdata:
  uploads:
  models:
  promdata:
  grafanadata:
  esdata:
