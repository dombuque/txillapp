# Serviços de desenvolvimento local. Credenciais apenas para uso local.
name: txillapp
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: txill
      POSTGRES_PASSWORD: txill_dev
      POSTGRES_DB: txillapp
    ports: ['5433:5432']
    volumes: ['pgdata:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U txill -d txillapp']
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ['6379:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
  minio:
    profiles: ['s3'] # opcional: docker compose --profile s3 up
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: txill
      MINIO_ROOT_PASSWORD: txill_dev_secret
    ports: ['9000:9000', '9001:9001']
    volumes: ['miniodata:/data']
volumes:
  pgdata:
  miniodata:
