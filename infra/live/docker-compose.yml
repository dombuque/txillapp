name: txillapp-live
x-logging: &logging
  driver: json-file
  options: { max-size: 10m, max-file: "5" }
services:
  livekit:
    image: livekit/livekit-server:v1.13.11
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    network_mode: host
    volumes: ["./livekit.yaml:/etc/livekit.yaml:ro"]
    logging: *logging
  caddy:
    image: caddy:2.8
    restart: unless-stopped
    network_mode: host
    volumes: ["./Caddyfile:/etc/caddy/Caddyfile:ro", "caddy_data:/data", "caddy_config:/config"]
    # O token que o Caddy exige em live.txillapp.com/llm (o mesmo OLLAMA_TOKEN do .env da API). Sem ele, /llm dá sempre 401.
    environment:
      OLLAMA_TOKEN: ${OLLAMA_TOKEN:-}
    logging: *logging
  # O modelo do SuperTxill (só texto, em CPU). Os lives têm prioridade: no máximo 5 CPUs (fica sempre 1 livre) e 6 GB, peso de CPU baixo
  # (com a máquina apertada o LiveKit passa à frente) e é o primeiro a sair se faltar memória. Só ouve em 127.0.0.1:
  # de fora chega-se só pelo Caddy, com o token.
  ollama:
    image: ollama/ollama:0.40.16
    restart: unless-stopped
    network_mode: host
    environment:
      OLLAMA_HOST: 127.0.0.1:11434
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_MAX_QUEUE: "8"
      OLLAMA_KEEP_ALIVE: 24h
      OLLAMA_CONTEXT_LENGTH: "8192"
      OLLAMA_NOPRUNE: "1"
    volumes: ["ollama_models:/root/.ollama"]
    # O teto tem de ficar acima dos fios do modelo (OLLAMA_NUM_THREAD=3 na API): com 3 fios num teto de 3 CPUs o Linux
    # trava-o a cada instante e gera a 1–2 palavras por segundo.
    cpus: 5
    cpu_shares: 256
    mem_limit: 6g
    memswap_limit: 6g
    oom_score_adj: 500
    logging: *logging
  coturn:
    image: coturn/coturn:4.6.2
    restart: unless-stopped
    network_mode: host
    command:
      - -n
      - --listening-port=3478
      - --fingerprint
      - --use-auth-secret
      - --static-auth-secret=${TURN_SECRET:?falta TURN_SECRET no .env}
      - --realm=txillapp.com
      - --min-port=49160
      - --max-port=49200
      - --no-cli
      - --no-tls
      - --no-dtls
      - --no-multicast-peers
      - --denied-peer-ip=10.0.0.0-10.255.255.255
      - --denied-peer-ip=172.16.0.0-172.31.255.255
      - --denied-peer-ip=192.168.0.0-192.168.255.255
      - --denied-peer-ip=127.0.0.0-127.255.255.255
      # Também os endereços que nunca são de outra pessoa na internet (nada de chegar à máquina, à rede interna ou ao serviço de metadados).
      - --denied-peer-ip=0.0.0.0-0.255.255.255
      - --denied-peer-ip=100.64.0.0-100.127.255.255
      - --denied-peer-ip=169.254.0.0-169.254.255.255
      - --denied-peer-ip=192.0.0.0-192.0.0.255
      - --denied-peer-ip=198.18.0.0-198.19.255.255
      - --denied-peer-ip=240.0.0.0-255.255.255.255
      - --denied-peer-ip=::1
      - --denied-peer-ip=::ffff:0.0.0.0-::ffff:255.255.255.255
      - --denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
      - --denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
      - --total-quota=200
      - --user-quota=6
      - --max-bps=2500000
      - --log-file=stdout
    logging: *logging
volumes:
  caddy_data:
  caddy_config:
  ollama_models:
